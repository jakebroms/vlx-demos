<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>VivaLynx for NYSOFA: demo</title>
  <style>
    :root {
      --rail: #0B0B0C;
      --rail-raised: #1A1A1C;
      --rail-line: #262629;
      --rail-ink: #F2F2F3;
      --rail-muted: #8C8C93;
      --accent: #2FC4BE;
      --stage: #0B0B0C;
      --open: 248px;
      --shut: 56px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--stage);
      color: var(--rail-ink);
    }
    nav {
      flex: 0 0 var(--open);
      display: flex;
      flex-direction: column;
      background: var(--rail);
      overflow: hidden;
      transition: flex-basis 160ms ease;
    }
    body.shut nav { flex-basis: var(--shut); }
    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 10px 0 16px;
      border-bottom: 1px solid var(--rail-line);
    }
    .top p {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rail-muted);
      white-space: nowrap;
    }
    body.shut .top { padding: 0; justify-content: center; }
    body.shut .top p { display: none; }
    button {
      flex: 0 0 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--rail-muted);
      cursor: pointer;
    }
    button:hover { background: var(--rail-raised); color: var(--rail-ink); }
    button svg { transition: transform 160ms ease; }
    body.shut button svg { transform: rotate(180deg); }
    ul { list-style: none; padding: 10px 8px; display: grid; gap: 2px; }
    a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 8px;
      color: var(--rail-ink);
      text-decoration: none;
      white-space: nowrap;
    }
    a:hover { background: var(--rail-raised); }
    .mark {
      flex: 0 0 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--rail-line);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--rail-muted);
    }
    .name { font-size: 14px; font-weight: 500; }
    .name small { display: block; font-size: 11px; font-weight: 400; color: var(--rail-muted); }
    body.shut .name { display: none; }
    a[aria-current="page"] { background: var(--rail-raised); }
    a[aria-current="page"] .mark { border-color: var(--accent); color: var(--accent); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .note {
      margin-top: auto;
      padding: 14px 16px;
      border-top: 1px solid var(--rail-line);
      font-size: 11px;
      line-height: 1.5;
      color: var(--rail-muted);
      white-space: normal;
    }
    body.shut .note { display: none; }
    main { flex: 1; min-width: 0; padding: 8px 8px 8px 0; }
    .screen { position: relative; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; background: var(--rail-raised); }
    .screen::before {
      content: "Loading…";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--rail-muted);
    }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; transition: opacity 320ms ease; }
    iframe.loading { visibility: hidden; }
    iframe.entering { opacity: 0; }
    @media (max-width: 720px) {
      :root { --open: 210px; }
    }
    @media (prefers-reduced-motion: reduce) {
      nav, button svg, iframe { transition: none; }
    }
  </style>
</head>
<body>
  <nav aria-label="Demo stops">
    <div class="top">
      <p>NYSOFA demo</p>
      <button type="button" aria-expanded="true" aria-controls="stops" aria-label="Collapse sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <ul id="stops">
      <li><a href="#email" data-src="/nysofa/email/" title="Invitation email"><span class="mark" aria-hidden="true">1</span><span class="name">Invitation email<small>Transitions home pathway</small></span></a></li>
      <li><a href="#eligibility" data-src="/nysofa/eligibility/" title="Eligibility page"><span class="mark" aria-hidden="true">2</span><span class="name">Eligibility page<small>Waitlist pathway</small></span></a></li>
      <li><a href="#reports" data-src="/nysofa/admin/" data-kind="export" title="NYSOFA's reports"><span class="mark" aria-hidden="true">3</span><span class="name">NYSOFA's reports<small>Program oversight</small></span></a></li>
    </ul>
    <p class="note">Illustrative demo for the Technology-Enabled Aging-in-Place Pilot proposal. Nothing here is a live program.</p>
  </nav>
  <main>
    <div class="screen" id="screen"></div>
  </main>
  <script>
    const links = [...document.querySelectorAll('nav a')];
    const screen = document.getElementById('screen');
    const toggle = document.querySelector('nav button');
    let shown = null;    // the frame on screen
    let pending = null;  // the frame being loaded for a switch

    function show() {
      const current = links.find(a => a.hash === location.hash) || links[0];
      links.forEach(a => a.removeAttribute('aria-current'));
      current.setAttribute('aria-current', 'page');
      const src = current.dataset.src;
      if (pending && pending.dataset.src === src) return;
      if (pending) { pending.remove(); pending = null; }
      if (shown && shown.dataset.src === src) return;
      load(src, current.title, current.dataset.kind === 'export');
    }

    // Load a stop into a fresh, hidden frame and crossfade once it is ready. A Claude
    // Design export is ready when it has swapped its placeholder for the real app; a
    // plain page when it has loaded. Either way the fonts get a moment to arrive.
    function load(src, title, isExport) {
      const frame = document.createElement('iframe');
      frame.className = 'loading entering';
      frame.title = title;
      frame.dataset.src = src;
      frame.src = src;
      screen.appendChild(frame);
      pending = frame;

      let loaded = false;
      frame.addEventListener('load', () => { loaded = true; });
      const started = Date.now();
      (function poll() {
        if (pending !== frame) return;
        let doc = null;
        try { doc = frame.contentDocument; } catch (e) {}
        let ready;
        if (isExport) {
          const root = doc && doc.getElementById('dc-root');
          ready = root && root.children.length > 0 && !doc.getElementById('__bundler_thumbnail');
        } else {
          ready = loaded || (doc && doc.readyState === 'complete' && doc.body && doc.body.children.length > 0);
        }
        if (!ready && Date.now() - started < 15000) { setTimeout(poll, 50); return; }
        const fonts = doc && doc.fonts ? doc.fonts.ready : Promise.resolve();
        Promise.race([fonts, new Promise(r => setTimeout(r, 1500))]).then(() => {
          if (pending !== frame) return;
          reveal(frame);
        });
      })();
    }

    function reveal(frame) {
      frame.classList.remove('loading');
      const old = shown;
      shown = frame;
      pending = null;
      void frame.offsetWidth; // commit the transparent state so the fade has a start point
      frame.classList.remove('entering');
      if (old) settle(frame, () => old.remove(), 2000);
    }

    function settle(el, fn, fallback) {
      let done = false;
      const go = () => { if (done) return; done = true; el.removeEventListener('transitionend', onEnd); fn(); };
      const onEnd = e => { if (e.target === el) go(); };
      el.addEventListener('transitionend', onEnd);
      setTimeout(go, fallback || 450);
    }

    function setShut(shut) {
      document.body.classList.toggle('shut', shut);
      toggle.setAttribute('aria-expanded', String(!shut));
      toggle.setAttribute('aria-label', shut ? 'Expand sidebar' : 'Collapse sidebar');
      try { localStorage.setItem('nysofa-sidebar', shut ? 'shut' : 'open'); } catch (e) {}
    }

    let saved = null;
    try { saved = localStorage.getItem('nysofa-sidebar'); } catch (e) {}
    setShut(saved === 'shut');

    toggle.addEventListener('click', () => setShut(!document.body.classList.contains('shut')));
    window.addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
