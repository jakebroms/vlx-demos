<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>VivaLynx demos</title>
  <style>
    :root {
      --rail: #0B0B0C;
      --rail-raised: #1A1A1C;
      --rail-line: #262629;
      --rail-ink: #F2F2F3;
      --rail-muted: #8C8C93;
      --accent: #2FC4BE;
      --stage: #0B0B0C;
      --open: 232px;
      --shut: 56px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--stage);
      color: var(--rail-ink);
    }
    nav {
      flex: 0 0 var(--open);
      display: flex;
      flex-direction: column;
      background: var(--rail);
      overflow: hidden;
      transition: flex-basis 160ms ease;
    }
    body.shut nav { flex-basis: var(--shut); }
    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 10px 0 16px;
      border-bottom: 1px solid var(--rail-line);
    }
    .top p {
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rail-muted);
      white-space: nowrap;
    }
    body.shut .top { padding: 0; justify-content: center; }
    body.shut .top p { display: none; }
    button {
      flex: 0 0 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--rail-muted);
      cursor: pointer;
    }
    button:hover { background: var(--rail-raised); color: var(--rail-ink); }
    button svg { transition: transform 160ms ease; }
    body.shut button svg { transform: rotate(180deg); }
    ul { list-style: none; padding: 10px 8px; display: grid; gap: 2px; }
    a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 8px;
      color: var(--rail-ink);
      text-decoration: none;
      white-space: nowrap;
    }
    a:hover { background: var(--rail-raised); }
    .mark {
      flex: 0 0 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid var(--rail-line);
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      color: var(--rail-muted);
    }
    .name { font-size: 14px; font-weight: 500; }
    .name small { display: block; font-size: 11px; font-weight: 400; color: var(--rail-muted); }
    body.shut .name { display: none; }
    a[aria-current="page"] { background: var(--rail-raised); }
    a[aria-current="page"] .mark { border-color: var(--accent); color: var(--accent); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main { flex: 1; min-width: 0; padding: 8px 8px 8px 0; }
    .stage, .device, .screen { position: relative; width: 100%; height: 100%; }
    .screen { border-radius: 10px; overflow: hidden; background: var(--rail-raised); }
    .screen::before {
      content: "Loading…";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--rail-muted);
    }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

    /* Each export unpacks itself with a wireframe placeholder and a status badge before
       the real screen mounts. A switch loads into a fresh frame kept invisible until
       that is over; the frame on screen stays put until then, so nothing flickers.
       The new frame then fades in over the old one. */
    iframe { transition: opacity 320ms ease; }
    iframe.loading { visibility: hidden; }
    iframe.entering { opacity: 0; }

    /* A web <-> phone switch changes the whole layout, so the stage fades through it */
    .stage { transition: opacity 220ms ease; }
    .stage.dim { opacity: 0; }

    /* Mobile paths sit in a phone frame on a lifted panel */
    body.phone main { padding: 8px 8px 8px 0; }
    body.phone .stage {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 40px 32px;
      border-radius: 10px;
      background: var(--rail-raised);
      overflow: auto;
    }
    /* The phone is drawn at real size (390 x 844 app screen plus a 47px status bar) and scaled to fit */
    .fit { position: relative; width: 100%; height: 100%; }
    body.phone .fit { width: calc(414px * var(--s, 1)); height: calc(915px * var(--s, 1)); }
    body.phone .device {
      position: absolute;
      top: 0;
      left: 0;
      width: 414px;
      height: 915px;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-radius: 60px;
      background: #000;
      box-shadow: 0 0 0 2px #3A3A3F, 0 24px 60px rgba(0, 0, 0, 0.5);
      transform: scale(var(--s, 1));
      transform-origin: top left;
    }
    .status { display: none; }
    body.phone .status {
      flex: 0 0 47px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px 0 36px;
      border-radius: 48px 48px 0 0;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 600;
    }
    body.phone .status::after {
      content: "";
      position: absolute;
      top: 23px;
      left: 50%;
      width: 120px;
      height: 34px;
      border-radius: 17px;
      background: #000;
      transform: translateX(-50%);
    }
    body.phone .status svg { display: block; }
    body.phone .screen { flex: 0 0 844px; height: 844px; border-radius: 0 0 48px 48px; }
    @media (max-height: 560px) {
      body.phone .stage { padding: 16px; }
    }
    @media (max-width: 720px) {
      :root { --open: 200px; }
    }
    @media (prefers-reduced-motion: reduce) {
      nav, button svg, iframe, .stage { transition: none; }
    }
  </style>
</head>
<body>
  <nav aria-label="User type">
    <div class="top">
      <p>User type</p>
      <button type="button" aria-expanded="true" aria-controls="paths" aria-label="Collapse sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <ul id="paths">
      <li><a href="#org" data-src="/org/" title="Organization admin"><span class="mark" aria-hidden="true">OA</span><span class="name">Organization admin<small>Web</small></span></a></li>
      <li><a href="#care-coordinator" data-src="/care-coordinator/" title="Care Coordinator"><span class="mark" aria-hidden="true">CC</span><span class="name">Care Coordinator<small>Web</small></span></a></li>
      <li><a href="#professional-caregiver" data-src="/professional-caregiver/" data-device="phone" title="Professional Caregiver"><span class="mark" aria-hidden="true">PC</span><span class="name">Professional Caregiver<small>Mobile</small></span></a></li>
    </ul>
  </nav>
  <main>
    <div class="stage">
      <div class="fit">
        <div class="device">
          <div class="status" aria-hidden="true">
            <span>9:41</span>
            <svg width="66" height="12" viewBox="0 0 66 12" fill="#000"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M31 3.2a9 9 0 0 1 11 0l-1.3 1.5a7 7 0 0 0-8.4 0zM33.4 6a5.3 5.3 0 0 1 6.2 0l-1.3 1.5a3.3 3.3 0 0 0-3.6 0zM36.5 8.6l1.6 1.8-1.6 1.6-1.6-1.6z"/><rect x="45.5" y="0.5" width="18" height="11" rx="3" fill="none" stroke="#000" opacity="0.4"/><rect x="47" y="2" width="15" height="8" rx="1.8"/><rect x="64.5" y="4" width="1.5" height="4" rx="0.7" opacity="0.4"/></svg>
          </div>
          <div class="screen" id="screen"></div>
        </div>
      </div>
    </div>
  </main>
  <script>
    const links = [...document.querySelectorAll('nav a')];
    const screen = document.getElementById('screen');
    const toggle = document.querySelector('nav button');
    let shown = null;    // the frame on screen
    let pending = null;  // the frame being loaded for a switch

    function show() {
      const current = links.find(a => a.hash === location.hash) || links[0];
      links.forEach(a => a.removeAttribute('aria-current'));
      current.setAttribute('aria-current', 'page');
      const src = current.dataset.src;
      if (pending && pending.dataset.src === src) return;
      if (pending) { pending.remove(); pending = null; }
      if (shown && shown.dataset.src === src) return;
      load(src, current.title, current.dataset.device === 'phone');
    }

    // Load a path into a fresh, hidden frame. Reveal it and drop the old one once the
    // export has swapped its placeholder for the real app and the fonts it asked for
    // have arrived, or after a generous cutoff so an error inside it still shows.
    function load(src, title, phone) {
      const frame = document.createElement('iframe');
      frame.className = 'loading entering';
      frame.title = title;
      frame.dataset.src = src;
      frame.src = src;
      screen.appendChild(frame);
      pending = frame;

      const started = Date.now();
      (function poll() {
        if (pending !== frame) return;
        let doc = null;
        try { doc = frame.contentDocument; } catch (e) {}
        const root = doc && doc.getElementById('dc-root');
        const mounted = root && root.children.length > 0 && !doc.getElementById('__bundler_thumbnail');
        if (!mounted && Date.now() - started < 15000) { setTimeout(poll, 50); return; }
        const fonts = doc && doc.fonts ? doc.fonts.ready : Promise.resolve();
        Promise.race([fonts, new Promise(r => setTimeout(r, 1500))]).then(() => {
          if (pending !== frame) return;
          const flip = shown && document.body.classList.contains('phone') !== phone;
          if (!flip) { reveal(frame, phone); return; }
          // The layout itself changes: fade the stage out, flip it, bring the new
          // frame in on its own, and fade back. A web demo never shows inside the phone.
          stageBox.classList.add('dim');
          settle(stageBox, () => {
            if (pending !== frame) { stageBox.classList.remove('dim'); return; }
            shown.remove();
            shown = null;
            reveal(frame, phone);
            stageBox.classList.remove('dim');
          });
        });
      })();
    }

    // Put the loaded frame on screen, fading it in over whatever is there, then drop the old one
    function reveal(frame, phone) {
      document.body.classList.toggle('phone', phone);
      fitPhone();
      frame.classList.remove('loading');
      const old = shown;
      shown = frame;
      pending = null;
      void frame.offsetWidth; // commit the transparent state so the fade has a start point
      frame.classList.remove('entering');
      // The old frame sits underneath, so it can wait for the fade to finish
      if (old) settle(frame, () => old.remove(), 2000);
    }

    // Run fn once el's transition has ended, or after a fallback for when there is none
    function settle(el, fn, fallback) {
      let done = false;
      const go = () => { if (done) return; done = true; el.removeEventListener('transitionend', onEnd); fn(); };
      const onEnd = e => { if (e.target === el) go(); };
      el.addEventListener('transitionend', onEnd);
      setTimeout(go, fallback || 450);
    }

    // Scale the real-size phone down to whatever room the stage has
    const stageBox = document.querySelector('.stage');
    function fitPhone() {
      if (!document.body.classList.contains('phone')) return;
      const css = getComputedStyle(stageBox);
      const w = stageBox.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
      const h = stageBox.clientHeight - parseFloat(css.paddingTop) - parseFloat(css.paddingBottom);
      const s = Math.min(1, w / 414, h / 915);
      document.body.style.setProperty('--s', Math.max(s, 0.3).toFixed(3));
    }
    new ResizeObserver(fitPhone).observe(stageBox);

    function setShut(shut) {
      document.body.classList.toggle('shut', shut);
      toggle.setAttribute('aria-expanded', String(!shut));
      toggle.setAttribute('aria-label', shut ? 'Expand sidebar' : 'Collapse sidebar');
      try { localStorage.setItem('demos-sidebar', shut ? 'shut' : 'open'); } catch (e) {}
    }

    let saved = null;
    try { saved = localStorage.getItem('demos-sidebar'); } catch (e) {}
    setShut(saved === 'shut');

    toggle.addEventListener('click', () => setShut(!document.body.classList.contains('shut')));
    window.addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
